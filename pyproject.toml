[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HyQD-grid-tdse"
version = "0.0.0"
description = "Direct grid-based solvers for few-body time-dependent Schrödinger equations"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { file = "LICENSE" }
authors = [{ name = "HyQD developers" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "HyQD-electromagnetic-fields",
    "HyQD-grid-lib>=1.1.0",
    "HyQD-integrator-lib>=0.2.0",
    "HyQD-matter-field-params",
    "numpy>=2.5.2,<2.6",
    "scipy>=1.18.0,<1.19",
    "opt-einsum>=3.4.0,<3.5",
    "numba>=0.67.0,<0.68",
    "sympy>=1.14.0,<1.15",
    "packaging",
    "tqdm",
    "matplotlib",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["grid_tdse*"]
exclude = ["build*", "tests*"]
