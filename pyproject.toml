[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "HyQD-grid-tdse"
version = "0.0.0"
description = "Grid-based TDSE tools"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.5.2,<2.6",
    "numba>=0.67.0,<0.68",
    "scipy>=1.18.0,<1.19",
    "opt_einsum>=3.4.0,<3.5",
    "sympy>=1.14.0,<1.15",
    "hyqd-grid-lib @ git+https://github.com/hyqd/grid-lib.git",
    "hyqd-electromagnetic-fields @ git+https://github.com/HyQD/electromagnetic-fields.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["grid_tdse*"]
exclude = ["build*"]
